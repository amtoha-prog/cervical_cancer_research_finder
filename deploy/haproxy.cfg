# HAProxy config on lb-01
# HTTP: redirect every visitor to HTTPS
frontend www-http
    bind *:80
    redirect scheme https code 301 if !{ ssl_fc }
    default_backend web-backend

# HTTPS: decrypt traffic using the certificate (SSL termination)
frontend www-https
    bind *:443 ssl crt /etc/haproxy/certs/www.alissamtoha.tech.pem
    http-request set-header X-Forwarded-Proto https
    default_backend web-backend

# Send visitors to web-01 and web-02 in turn; "check" skips a server that is down
backend web-backend
    balance roundrobin
    server 7345-web-01 3.9.164.248:80 check
    server 7345-web-02 18.133.181.20:80 check
