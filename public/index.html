<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCRF - Cervical Cancer Research Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Cervical Cancer Research Finder</h1>
    <p>Find published research on cervical cancer in East Africa</p>
  </header>

  <main>
    <form id="searchForm">
      <label for="keywordsInput">Keywords (optional)</label>
      <input type="text" id="keywordsInput" placeholder="e.g. HPV vaccine, self-sampling">

      <div class="quick-search">
        <span>Quick search:</span>
        <button type="button" class="quick-button" data-keyword="HPV vaccination">HPV vaccination</button>
        <button type="button" class="quick-button" data-keyword="screening">Screening</button>
        <button type="button" class="quick-button" data-keyword="prevention">Prevention</button>
        <button type="button" class="quick-button" data-keyword="early detection">Early detection</button>
        <button type="button" class="quick-button" data-keyword="treatment">Treatment</button>
      </div>

        <!-- Filters -->
         <div class="filters">
          <div class="filter">
           <label for="countrySelect">Country</label>
           <select id="countrySelect">
            <!-- Values must match the COUNTRIES list in server.js exactly -->
             <option value="">All EAC countries</option>
             <option value="Rwanda">Rwanda</option>
             <option value="Tanzania">Tanzania</option>
             <option value="Kenya">Kenya</option>
             <option value="Uganda">Uganda</option>
             <option value="Burundi">Burundi</option>
             <option value="South Sudan">South Sudan</option>
             <option value="Democratic Republic of the Congo">DR Congo</option>
             <option value="Somalia">Somalia</option>
          </select>
        </div>

        <div class="filter">
          <label for="sortSelect">Sort by</label>
          <select id="sortSelect">
            <option value="newest">Newest first</option>
            <option value="relevance">Best match</option>
          </select>
        </div>

             <!-- Year filter -->
            <div class="filter">
              <label for="fromYearInput">From year (optional)</label>
              <input type="number" id="fromYearInput" min="1950" max="2026" placeholder="e.g. 2015">
            </div>

            <div class="filter">
              <label for="toYearInput">To year (optional)</label>
              <input type="number" id="toYearInput" min="1950" max="2026" placeholder="e.g. 2026">
            </div>
        </div>   
        
        <!--Search button-->
        <button type="submit">Search</button>
    </form>

    <p id="message" aria-live="polite"></p>

    <!--Article cards-->
    <div id="results"></div>
  </main>

  <footer>
    <p>The country shown is based on the article's text or authors' affiliations, so research may not have been conducted there.</p>
    <p>Data from <a href="https://pubmed.ncbi.nlm.nih.gov/" target="_blank" rel="noopener">PubMed</a> (NCBI). This tool does not give medical advice.</p>
  </footer> 

  <script src="script.js"></script>
</body>
</html>
